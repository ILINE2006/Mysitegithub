<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hat</title>
    <link rel="icon" type="image/png" href="img/channels4_profile (1).png">
    <link rel="stylesheet" href="asdz.css">
  </head>
<body>
  <!-- Звёзды -->
  <div class="stars" id="stars"></div>

  <!-- Контент -->
  <div class="content">
    <div class="profile">
      <img src="img/baby-cute.gif" alt="Profile GIF">
    </div>
    <div class="text">
      <h1>Black Hat</h1>
      <p>Привет! Ты посетил мой сайт — тут ты можешь увидеть, на каких серверах я бываю, на чем работаю и во что просиживаю время.</p>
    </div>
    
    <!-- Блоки с информацией -->
    <div class="info-section">
      <!-- Серверы -->
      <div class="servers-container">
        <div class="info-block">
          <div class="divider"></div>
          <div class="info-title">На каких серверах бываю</div>
          <div class="items-container">
            <div class="item">
              <div class="item-image">
                <img src="img/a_a0f28a71aad6c07db2521c27c86022a9.webp" alt="Elysium">
              </div>
              <div class="item-label">Elysium</div>
            </div>
            <div class="item">
              <div class="item-image">
                <img src="img/8asdasd94663985650081864.gif" alt="Hatory">
              </div>
              <div class="item-label">Hatory</div>
            </div>
            <div class="item">
              <div class="item-image">
                <img src="img/a_5c1cbaf425cc4a079aaae8140b4da1c3.gif" alt="ARUKU">
              </div>
              <div class="item-label">ARUKU</div>
            </div>
            <div class="item">
              <div class="item-image">
                <img src="img/a_da8d909ea9f6dc54984b1a6372f7a13f.webp" alt="XIVIVIDE">
              </div>
              <div class="item-label">TENDERLY</div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Технологии -->
      <div class="work-container">
        <div class="info-block">
          <div class="divider"></div>
          <div class="info-title">На чем работаю</div>
          <div class="items-container">
            <div class="item">
              <div class="item-image">
                <img src="img/d30bd94d-d64a-41f8-8cd4-dceb3f01d415.png" alt="C++">
              </div>
              <div class="item-label">C++</div>
            </div>
            <div class="item">
              <div class="item-image">
                <img src="img/68747470733a2f2f692e696d6775722e636f6d2f426970424d51492e706e67.png" alt="JavaScript">
              </div>
              <div class="item-label">JavaScript</div>
            </div>
            <div class="item">
              <div class="item-image">
                <img src="img/django-featured-image.jpg" alt="Django">
              </div>
              <div class="item-label">Django</div>
            </div>
            <div class="item">
              <div class="item-image">
                <img src="img/i (23).webp" alt="PHP">
              </div>
              <div class="item-label">PHP</div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Игры -->
      <div class="games-container">
        <div class="info-block">
          <div class="divider"></div>
          <div class="info-title">Во что играю</div>
          <div class="items-container">
            <div class="item">
              <div class="item-image square">
                <img src="img/sdfdfasfdsdf.jpg" alt="DOTA 2">
              </div>
              <div class="item-label">DOTA 2</div>
            </div>
            <div class="item">
              <div class="item-image square">
                <img src="img/gta-5-7206.png" alt="Game 2">
              </div>
              <div class="item-label">GTA 5</div>
            </div>
            <div class="item">
              <div class="item-image square">
                <img src="img/channels4_profile.png" alt="Game 3">
              </div>
              <div class="item-label">Elden Ring</div>
            </div>
            <div class="item">
              <div class="item-image square">
                <img src="img/gXTCNVUIgSzevHwIggOHfXzwrUXAi6ljSFLZYiwwuuLNhzubbgcRc4GAKaH0G9_aRB3IRImueRQo31mZYdWM7Ax-FvfeFMolkuAxhEvLTHDqtunTVQorp1pViWOrOnN.webp" alt="Game 4">
              </div>
              <div class="item-label">Hunt: Showdown</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="aads.js"></script>
</body>
</html>
